services:
  - type: web
    name: pmpe-study-pro-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: FRONTEND_URL
        sync: false
