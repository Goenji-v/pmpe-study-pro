services:
  - type: web
    name: pmpe-study-pro-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: SUPABASE_URL
        value: https://kibnmdwabpiwyprkrhvq.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STUDY_STORAGE_ENDPOINT
        sync: false
      - key: STUDY_STORAGE_REGION
        value: auto
      - key: STUDY_STORAGE_BUCKET
        sync: false
      - key: STUDY_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STUDY_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STUDY_STORAGE_MAX_FILE_BYTES
        value: 5368709120
