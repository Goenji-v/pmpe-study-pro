name: Study Pro PR562 Real GoTrue Staging QA
on:
  push:
    branches: [fix/proteger-gravacoes-estruturais-cas]
    paths:
      - "scripts/qa/staging-real-auth-pr562.mjs"
      - ".github/workflows/e2e-staging-auth-real-pr562.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr562-real-auth-qa
  cancel-in-progress: false
jobs:
  staging-real-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STUDY_PRO_AUTH_QA_ENABLED: "true"
      VITE_STUDY_PRO_STAGING_GUARD: "true"
      VITE_SUPABASE_URL: https://isjzyyoqvftrltkctanw.supabase.co
      # Client-side publishable key, NOT a service_role key or admin credential.
      # Used only against the isolated, empty staging project.
      VITE_SUPABASE_ANON_KEY: sb_publishable_W1M1ZLpupaY18gpiJ2itjw_8DNd4H16
    steps:
      - name: Check out isolated PR branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute real GoTrue/RLS/CAS/backup QA without admin credentials
        run: node scripts/qa/staging-real-auth-pr562.mjs
