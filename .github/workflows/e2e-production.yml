name: E2E Production

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  e2e:
    name: Smoke e fluxo autenticado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke obrigatório
        run: npm run e2e:smoke

      - name: Documentos legais públicos
        run: >-
          npx playwright test e2e/legal-public.spec.ts
          --project=desktop-chrome
          --project=mobile-chrome
      - name: Verificar conta E2E dedicada
        id: conta
        shell: bash
        run: |
          if [ -n "$E2E_TEST_EMAIL" ] && [ -n "$E2E_TEST_PASSWORD" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure E2E_TEST_EMAIL e E2E_TEST_PASSWORD com uma conta exclusiva de testes. Sem eles, a validação autenticada é incompleta."
            exit 1
          fi
      - name: Fluxo autenticado crítico
        run: npm run e2e:auth
      - name: Preservar diagnóstico Playwright em falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-production-diagnostico-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Publicar diagnóstico no resumo
        if: always()
        shell: bash
        run: |
          echo "## E2E Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base URL: $E2E_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: executado" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.conta.outputs.disponivel }}" = "true" ]; then
            echo "- Fluxo autenticado: executado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Fluxo autenticado: aguardando secrets E2E_TEST_EMAIL/E2E_TEST_PASSWORD" >> "$GITHUB_STEP_SUMMARY"
          fi

  permissoes-parceiro:
    name: Auditoria da Área do Parceiro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Exigir conta de teste autenticada
        shell: bash
        run: |
          if [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "::error::Testes do Parceiro não podem ser ignorados: configure a conta E2E dedicada."
            exit 1
          fi
      - name: Validar permissões, rotas e responsividade
        run: npx playwright test e2e/partner-permissions.spec.ts e2e/partner-area-audit.spec.ts
      - name: Preservar diagnóstico em falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-parceiro-auditoria-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
