name: E2E Temporary Validation

on:
  push:
    branches: [test/e2e-critico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar smoke E2E
        run: npm run e2e:smoke
      - name: Executar Quality Gate local
        run: npm run check
