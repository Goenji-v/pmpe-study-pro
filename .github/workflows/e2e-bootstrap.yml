name: E2E Bootstrap

on:
  push:
    branches: [test/e2e-critico]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test/e2e-critico
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar Playwright no projeto
        run: npm install --save-dev @playwright/test
      - name: Persistir package.json e package-lock.json
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: adicionar Playwright"
          git push origin HEAD:test/e2e-critico
