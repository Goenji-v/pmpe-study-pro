name: Temp Fix qs Lockfile

on:
  push:
    branches:
      - fix/qs-6-16-0

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qs-6-16-0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Atualizar apenas qs no lockfile
        run: npm update qs --package-lock-only --ignore-scripts
      - name: Verificar versão corrigida
        run: node -e "const v=require('./package-lock.json').packages['node_modules/qs'].version; console.log('qs='+v); if(v!=='6.16.0') process.exit(1)"
      - name: Validar instalação congelada
        run: npm ci --ignore-scripts
      - name: Auditar dependências de produção
        run: npm audit --audit-level=moderate --omit=dev
      - name: Commitar lockfile corrigido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix: atualizar qs para 6.16.0"
          git push origin HEAD:fix/qs-6-16-0
