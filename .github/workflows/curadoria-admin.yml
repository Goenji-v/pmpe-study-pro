name: Curadoria administrativa temporaria

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/curadoria-admin.yml"

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://kibnmdwabpiwyprkrhvq.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Aplicar curadoria revisada
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          node <<'NODE'
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SECRET_KEY;
          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          };
          async function request(path, options = {}) {
            const response = await fetch(new URL(path, url), { ...options, headers: { ...headers, ...(options.headers || {}) } });
            if (!response.ok) throw new Error(`Supabase respondeu ${response.status}: ${await response.text()}`);
            const text = await response.text();
            return text ? JSON.parse(text) : [];
          }

          const pending = await request("/rest/v1/questoes_catalogo?status=eq.pendente&select=id,enunciado,alternativas,resposta_correta_id,created_at&order=created_at.desc&limit=100");
          if (pending.length !== 32) throw new Error(`Proteção acionada: esperadas 32 pendentes, encontradas ${pending.length}`);
          const createdTimes = pending.map((row) => Date.parse(row.created_at)).filter(Number.isFinite);
          if (createdTimes.length !== 32) throw new Error("Proteção acionada: datas de importação incompletas");
          const batchStart = encodeURIComponent(new Date(Math.min(...createdTimes) - 60000).toISOString());
          const batchEnd = encodeURIComponent(new Date(Math.max(...createdTimes) + 60000).toISOString());
          const recentActive = await request(`/rest/v1/questoes_catalogo?status=eq.ativa&created_at=gte.${batchStart}&created_at=lte.${batchEnd}&select=id,enunciado,alternativas,resposta_correta_id,created_at&order=created_at.desc&limit=20`);
          if (recentActive.length !== 4) throw new Error(`Proteção acionada: esperadas 4 questões do mesmo lote já publicadas, encontradas ${recentActive.length}`);
          const cohort = [...pending, ...recentActive];
          if (new Set(cohort.map((row) => row.id)).size !== 36) throw new Error("Proteção acionada: o lote reconstruído não contém 36 questões únicas");

          const norm = (value) => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
          const corpus = (row) => norm(row.enunciado + " " + JSON.stringify(row.alternativas));
          const archiveRules = [
            (s) => s.includes("diariamente") && s.includes("sempre") && s.includes("adverb"),
            (s) => s.includes("se chove") && s.includes("rua") && s.includes("molhad"),
            (s) => s.includes("discriminacao racial") && s.includes("religios"),
            (s) => s.includes("subestimar"),
            (s) => s.includes("monossilab") && s.includes("dissilab") && s.includes("trissilab"),
            (s) => s.includes("arquitetura") && s.includes("subsidiario") && s.includes("acompanhamento"),
          ];

          const archive = cohort.filter((row) => archiveRules.some((rule) => rule(corpus(row))));
          const correction = cohort.filter((row) => {
            const s = corpus(row);
            return s.includes("efeitos da condenacao") && s.includes("interdicao") && s.includes("dobro");
          });
          if (archive.length !== 6) throw new Error(`Proteção acionada: esperadas 6 para arquivar, identificadas ${archive.length}`);
          if (correction.length !== 1) throw new Error(`Proteção acionada: esperada 1 correção, identificadas ${correction.length}`);
          if (archive.some((row) => correction.some((item) => item.id === row.id))) throw new Error("Proteção acionada: conjuntos de arquivamento e correção se sobrepõem");

          const archiveIds = new Set(archive.map((row) => row.id));
          const publish = cohort.filter((row) => !archiveIds.has(row.id));
          if (publish.length !== 30) throw new Error(`Proteção acionada: esperadas 30 publicações, identificadas ${publish.length}`);

          const now = new Date().toISOString();
          const patchIds = async (ids, payload) => {
            const filter = ids.map(encodeURIComponent).join(",");
            return request(`/rest/v1/questoes_catalogo?id=in.(${filter})`, {
              method: "PATCH",
              body: JSON.stringify({ ...payload, revisada_em: now, updated_at: now }),
            });
          };

          const archived = await patchIds([...archiveIds], {
            status: "arquivada",
            motivo_status: "Arquivada após revisão humana: questão inválida, ambígua ou com múltiplas respostas defensáveis.",
          });
          const corrected = await patchIds(correction.map((row) => row.id), {
            resposta_correta_id: "B",
            status: "ativa",
            confianca_classificacao: "alta",
            motivo_status: "Gabarito corrigido e conteúdo aprovado em revisão humana.",
          });
          const correctionIds = new Set(correction.map((row) => row.id));
          const regularIds = publish.filter((row) => !correctionIds.has(row.id)).map((row) => row.id);
          const publishedRegular = await patchIds(regularIds, {
            status: "ativa",
            confianca_classificacao: "alta",
            motivo_status: "Conteúdo e gabarito aprovados em revisão humana.",
          });

          const quotaErrors = await request("/rest/v1/erros_cliente?status=eq.aberto&mensagem=ilike.*quota*&select=id&limit=100");
          let resolved = [];
          if (quotaErrors.length) {
            const filter = quotaErrors.map((row) => encodeURIComponent(row.id)).join(",");
            resolved = await request(`/rest/v1/erros_cliente?id=in.(${filter})&status=eq.aberto`, {
              method: "PATCH",
              body: JSON.stringify({ status: "resolvido", resolvido_em: now }),
            });
          }

          if (archived.length !== 6 || corrected.length !== 1 || publishedRegular.length !== 29) {
            throw new Error(`Resultado inesperado: arquivadas=${archived.length}, corrigidas=${corrected.length}, publicadas_regulares=${publishedRegular.length}`);
          }
          console.log(`RESULTADO arquivadas=${archived.length} publicadas=${corrected.length + publishedRegular.length} corrigidas=${corrected.length} erros_resolvidos=${resolved.length}`);
          NODE
