name: Mobile Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-final-2026-10-06

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  mobile-audit:
    name: Auditoria mobile 360px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://pmpe-study-pro-git-fix-mobile-final-2026-10-06-pmpe-study-pro.vercel.app
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Verificar conta E2E dedicada
        shell: bash
        run: |
          test -n "$E2E_TEST_EMAIL"
          test -n "$E2E_TEST_PASSWORD"
      - name: Aguardar preview do commit
        shell: bash
        run: |
          for tentativa in $(seq 1 40); do
            versao="$(curl -fsSL "$E2E_BASE_URL/version.json?t=$(date +%s)" || true)"
            if echo "$versao" | grep -q "${GITHUB_SHA}"; then
              echo "Preview atualizado para ${GITHUB_SHA}."
              exit 0
            fi
            echo "Aguardando preview... tentativa $tentativa/40"
            sleep 10
          done
          echo "Preview não chegou ao commit esperado."
          exit 1
      - name: Auditar mobile
        run: >-
          npx playwright test
          e2e/mobile-complete-audit.spec.ts
          e2e/mobile-visual-audit.spec.ts
          --project=mobile-chrome
      - name: Anexar relatório visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 7
