name: Mobile Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-audit:
    name: Auditoria mobile 360px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://pmpe-study-pro-git-qa-mobile-complete-audit-pmpe-study-pro.vercel.app
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Verificar conta E2E dedicada
        shell: bash
        run: |
          test -n "$E2E_TEST_EMAIL"
          test -n "$E2E_TEST_PASSWORD"
      - name: Auditar mobile
        run: >-
          npx playwright test
          e2e/mobile-complete-audit.spec.ts
          e2e/mobile-visual-audit.spec.ts
          --project=mobile-chrome
      - name: Anexar relatório visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 7
