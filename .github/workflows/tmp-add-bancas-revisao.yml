name: Temp Add Bancas Revisao

on:
  push:
    branches:
      - fix/bancas-predefinidas-revisao

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bancas-predefinidas-revisao
      - name: Adicionar bancas predefinidas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/CentralEstudos/CentralEstudos.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { obterReferenciasDaMissao, planoPMPE } from "../../data/planoPMPE";\n'
          constant = '''\nconst BANCAS_CONCURSO = [\n  "Cebraspe (Cespe)",\n  "FGV",\n  "FCC",\n  "Vunesp",\n  "Instituto AOCP",\n  "IBFC",\n  "IDECAN",\n  "Instituto Consulplan",\n  "Instituto Quadrix",\n  "IADES",\n  "Cesgranrio",\n  "Fundatec",\n  "Instituto Selecon",\n  "Instituto ACCESS",\n  "FEPESE",\n] as const;\n'''

          if 'const BANCAS_CONCURSO = [' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f'âncora de import inesperada: {text.count(import_anchor)}')
              text = text.replace(import_anchor, import_anchor + constant, 1)

          old = '''                    <input\n                      value={banca}\n                      onChange={(evento) =>\n                        setBanca(\n                          evento.target.value\n                        )\n                      }\n                      placeholder="AOCP, Cebraspe..."\n                    />'''
          new = '''                    <input\n                      list="bancas-concurso"\n                      value={banca}\n                      onChange={(evento) =>\n                        setBanca(\n                          evento.target.value\n                        )\n                      }\n                      placeholder="Selecione ou digite uma banca"\n                    />\n                    <datalist id="bancas-concurso">\n                      {BANCAS_CONCURSO.map((nomeBanca) => (\n                        <option key={nomeBanca} value={nomeBanca} />\n                      ))}\n                    </datalist>'''

          if old not in text:
              raise SystemExit('campo de banca não encontrado no formato esperado')
          if text.count(old) != 1:
              raise SystemExit(f'campo de banca apareceu {text.count(old)} vezes')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar alteração
        run: |
          grep -q 'list="bancas-concurso"' src/pages/CentralEstudos/CentralEstudos.tsx
          grep -q 'Instituto AOCP' src/pages/CentralEstudos/CentralEstudos.tsx
          test "$(grep -c '^  "' src/pages/CentralEstudos/CentralEstudos.tsx | head -1)" -ge 0 || true
          git diff --check

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CentralEstudos/CentralEstudos.tsx
          git diff --cached --quiet && exit 0
          git commit -m "UX: adicionar bancas predefinidas na revisão de questões"
          git push origin HEAD:fix/bancas-predefinidas-revisao
