name: Validar prévia de conteúdos em blocos
on:
  push:
    branches: [preview/study-pro-espelho-unico-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/conteudos-blocos-preview.spec.ts --project=desktop-chrome
