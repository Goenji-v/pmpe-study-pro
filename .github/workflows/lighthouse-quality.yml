name: Lighthouse Quality Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "15 11 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lighthouse:
    name: Auditar desempenho e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar produção deste commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          for tentativa in $(seq 1 42); do
            publicado="$(
              curl -fsS "https://pmpe-study-pro-two.vercel.app/version.json?t=$(date +%s)" |
              node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(x).commit||"")}catch{}})'
            )"

            if [[ "$publicado" == "$GITHUB_SHA" ]]; then
              echo "Deploy $publicado confirmado."
              exit 0
            fi

            echo "Aguardando produção: esperado=$GITHUB_SHA atual=$publicado"
            sleep 10
          done

          echo "A produção não chegou ao commit esperado dentro do prazo."
          exit 1

      - name: Verificar produção
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://pmpe-study-pro-two.vercel.app/login >/dev/null
          curl --fail --silent --show-error --location --max-time 30 \
            https://pmpe-study-pro-two.vercel.app/demo >/dev/null

      - name: Instalar Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Executar Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: lhci autorun --config=./lighthouserc.json

      - name: Preservar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-quality-${{ github.run_number }}
          path: |
            lighthouse-report
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
