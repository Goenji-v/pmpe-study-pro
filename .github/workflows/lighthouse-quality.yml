name: Lighthouse Quality Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "15 11 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lighthouse:
    name: Auditar desempenho e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar produção
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://pmpe-study-pro-two.vercel.app/login >/dev/null
          curl --fail --silent --show-error --location --max-time 30 \
            https://pmpe-study-pro-two.vercel.app/demo >/dev/null

      - name: Instalar Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Executar Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: lhci autorun --config=./lighthouserc.json

      - name: Preservar relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-quality-${{ github.run_number }}
          path: |
            lighthouse-report
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
