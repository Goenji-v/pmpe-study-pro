name: Accessibility Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "45 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: Auditar login e demonstração
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar auditoria
        run: npx playwright test e2e/accessibility-public.spec.ts --project=desktop-chrome

      - name: Preservar diagnóstico em falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-audit-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
