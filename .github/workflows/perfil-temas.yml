name: Validar perfil e temas
on:
  push:
    branches: [release/perfil-temas-oficial, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/identidade-preview.spec.ts --project=desktop-chrome
