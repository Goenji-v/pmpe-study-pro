name: E2E Public Runtime v1.1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-public:
    name: Rotas públicas, login e responsividade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A prévia Vercel exige SSO e não pode ser acessada anonimamente pelo Playwright.
      # Testes de navegação pública usam o site oficial sem submeter dados ou alterar registros.
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke de rotas protegidas, login e demonstração
        run: npm run e2e:smoke
      - name: Documentos legais públicos em desktop e mobile
        run: npx playwright test e2e/legal-public.spec.ts --project=desktop-chrome --project=mobile-chrome
      - name: Preservar relatório em falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-public-diagnostico-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
