name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar vulnerabilidades high
        run: npm audit --audit-level=high
      - name: Executar lint sem avisos
        run: npm run lint -- --deny-warnings --format=agent
      - name: Executar testes
        run: npm test
      - name: Executar TypeScript e build
        run: npm run build
      - name: Instalar Chromium para smoke
        run: npx playwright install --with-deps chromium
      - name: Subir preview local
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pmpe-vite.log 2>&1 &
          echo $! > /tmp/pmpe-vite.pid
          for tentativa in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pmpe-vite.log
          exit 1
      - name: Smoke real no navegador
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/smoke.spec.ts --project=desktop-chrome
      - name: Publicar diagnóstico Playwright em falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quality-gate-playwright-${{ github.run_number }}
          path: |
            playwright-report
            test-results
            /tmp/pmpe-vite.log
          if-no-files-found: ignore
          retention-days: 7
