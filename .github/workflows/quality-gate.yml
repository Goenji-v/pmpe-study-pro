name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Diagnosticar vulnerabilidades
        run: npm audit --json || true
      - name: Executar lint
        run: npm run lint -- --format=agent
      - name: Executar testes
        run: npm test
      - name: Executar TypeScript e build
        run: npm run build
