name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar vulnerabilidades high
        run: npm audit --audit-level=high
      - name: Executar lint sem avisos
        run: npm run lint -- --deny-warnings --format=agent
      - name: Executar testes
        run: npm test
      - name: Executar TypeScript e build
        run: npm run build
