name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar vulnerabilidades high
        shell: bash
        run: |
          set -uo pipefail

          verificar_dependencias_inalteradas() {
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git fetch origin "${{ github.base_ref }}" --depth=1
              git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- package.json package-lock.json
              return $?
            fi

            if git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --quiet HEAD^ HEAD -- package.json package-lock.json
              return $?
            fi

            return 1
          }

          for tentativa in 1 2 3; do
            set +e
            saida="$(npm audit --audit-level=high 2>&1)"
            codigo=$?
            set -e

            echo "$saida"

            if [[ $codigo -eq 0 ]]; then
              exit 0
            fi

            if echo "$saida" | grep -Eqi               "503 Service Unavailable|audit endpoint returned an error|currently performing maintenance"; then
              if [[ $tentativa -lt 3 ]]; then
                sleep 3
                continue
              fi

              if verificar_dependencias_inalteradas; then
                echo "::warning::npm audit indisponível por manutenção externa; dependências não foram alteradas neste commit/PR."
                exit 0
              fi
            fi

            exit $codigo
          done
      - name: Executar lint sem avisos
        run: npm run lint -- --deny-warnings --format=agent
      - name: Executar testes
        run: npm test
      - name: Executar TypeScript e build
        run: npm run build
