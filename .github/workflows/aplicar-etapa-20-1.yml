name: Aplicar Etapa 20.1

on:
  push:
    branches:
      - etapa-20-1-mobile-compacto
    paths:
      - '.sync/**'
      - '.github/workflows/aplicar-etapa-20-1.yml'

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ hashFiles('.sync/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e aplicar snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/projeto.b64.* > /tmp/projeto.b64
          base64 -d /tmp/projeto.b64 > /tmp/projeto.tar.xz
          rm -rf src server supabase
          rm -f package.json package-lock.json tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts vercel.json render.yaml index.html .gitignore .oxlintrc.json .env.example
          tar -xJf /tmp/projeto.tar.xz -C .
          rm -rf .sync
          rm -f .github/workflows/aplicar-etapa-20-1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit da versao acumulada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Study Pro Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para aplicar."
            exit 0
          fi
          git commit -m "Etapa 20.1 - mobile compacto e versao acumulada"
          git push origin HEAD:etapa-20-1-mobile-compacto
