name: Public Runtime Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "5 12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  runtime:
    name: Auditar console e rede
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_BASE_URL: https://pmpe-study-pro-two.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Auditar runtime público
        run: npx playwright test e2e/public-runtime-health.spec.ts --project=desktop-chrome

      - name: Preservar diagnóstico em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-runtime-audit-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
