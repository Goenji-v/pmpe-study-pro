services:
  - type: web
    name: pmpe-study-pro-api-staging
    runtime: node
    plan: free
    repo: https://github.com/Goenji-v/pmpe-study-pro
    branch: audit/reliability-2026-09-18
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/saude
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: SUPABASE_URL
        value: https://kibnmdwabpiwyprkrhvq.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://pmpe-study-pro-git-audit-reliability-2026-09-18-pmpe-study-pro.vercel.app
