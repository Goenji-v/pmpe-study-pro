<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a35" />
    <title>Studio Pro — sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#0c2d55 0,#071523 34%,#03080f 100%);color:#f7fbff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:30px;border:1px solid rgba(78,151,227,.32);border-radius:20px;background:rgba(5,17,31,.9);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.logo{width:72px;height:72px;margin:0 auto 18px}.logo img{width:100%;height:100%}h1{margin:0 0 10px;font-size:24px}p{margin:0;color:#9eb1c7;line-height:1.55}button{margin-top:22px;padding:12px 18px;border:1px solid #48a7ff;border-radius:11px;background:linear-gradient(180deg,#168bff,#0a63e8);color:#fff;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo"><img src="/assets/studio-pro-mark.svg?v=2" alt="" /></div>
      <h1>Você está sem conexão</h1>
      <p>O Studio Pro precisa de internet para carregar os dados mais recentes. Assim que a conexão voltar, tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
