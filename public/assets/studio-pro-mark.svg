    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00142d" flood-opacity=".88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#078BFF" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#0D2E55" stroke-width="4" opacity=".72"/>

  <g filter="url(#shieldGlow)">
    <path d="M256 74 401 130v111c0 98-58 171-145 215-87-44-145-117-145-215V130L256 74Z" fill="#020817" stroke="url(#outer)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M256 98 380 145v95c0 82-48 143-124 182-76-39-124-100-124-182v-95L256 98Z" fill="url(#inner)" stroke="#2DCBFF" stroke-opacity=".92" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 111 365 153" stroke="#D5F5FF" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
  </g>

  <line x1="256" y1="165" x2="256" y2="348" stroke="url(#outer)" stroke-opacity=".72" stroke-width="3"/>
  <text x="203" y="331" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="600" fill="url(#sSilver)">S</text>
  <text x="313" y="331" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="600" fill="url(#pBlue)">P</text>
