<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Studio Pro</title>
  <desc id="desc">Ícone azul escuro do Studio Pro com escudo SP</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="30%" r="78%">
      <stop offset="0" stop-color="#0b2a52"/>
      <stop offset=".52" stop-color="#06172d"/>
      <stop offset="1" stop-color="#020811"/>
    </radialGradient>
    <linearGradient id="outer" x1="105" y1="82" x2="406" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF0FF"/>
      <stop offset=".26" stop-color="#25CBFF"/>
      <stop offset=".62" stop-color="#0B7BFF"/>
      <stop offset="1" stop-color="#0545D8"/>
    </linearGradient>
    <linearGradient id="inner" x1="156" y1="127" x2="365" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1D38"/>
      <stop offset=".58" stop-color="#061126"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="pBlue" x1="286" y1="177" x2="348" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76F0FF"/>
      <stop offset=".38" stop-color="#19C6FF"/>
      <stop offset=".72" stop-color="#087EFF"/>
      <stop offset="1" stop-color="#0643D5"/>
    </linearGradient>
    <linearGradient id="sSilver" x1="164" y1="176" x2="228" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
