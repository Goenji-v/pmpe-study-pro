<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Study Pro SP</title>
  <desc id="desc">Escudo SP metálico vermelho e prata para o Study Pro</desc>
  <defs>
    <linearGradient id="outer" x1="105" y1="82" x2="406" y2="432" gradientUnits="userSpaceOnUse">
